<app-auth-card [title]="'iam.forgot.title' | translate" [subtitle]="'iam.forgot.subtitle' | translate">
  @for (error of store.errors(); track error) {
    <div class="error-box" role="alert">{{ error | translate }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submitReset()" novalidate>
    <div class="field">
      <label class="field-label" for="email">{{ 'iam.fields.email' | translate }}</label>
      <input id="email" class="input" type="email" formControlName="email"
             placeholder="nombre@correo.com" [class.invalid]="emailError()">
      @if (emailError()) {
        <span class="field-error">{{ emailError() | translate }}</span>
      }
    </div>

    <app-password-field [control]="form.controls.password" label="iam.fields.new-password"
                        autocomplete="new-password" [showStrength]="true"/>
    <app-password-field [control]="form.controls.confirmPassword" label="iam.fields.confirm-password"
                        autocomplete="new-password" [mismatch]="form.hasError('mismatch')"/>

    <button type="submit" class="submit">
      {{ 'iam.forgot.submit' | translate }}
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </form>

  <p class="footer-text">
    <button type="button" class="link" (click)="navigateToSignIn()">
      {{ 'iam.forgot.back' | translate }}
    </button>
  </p>
</app-auth-card>
