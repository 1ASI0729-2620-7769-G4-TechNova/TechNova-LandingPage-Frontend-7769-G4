<section class="panel">
  <h1>{{ 'iam.change.title' | translate }}</h1>
  <p class="subtitle">{{ 'iam.change.subtitle' | translate }}</p>

  @if (saved()) {
    <div class="notice" role="status">{{ 'iam.notice.password-changed' | translate }}</div>
  }
  @for (error of store.errors(); track error) {
    <div class="error-box" role="alert">{{ error | translate }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submitChange()" novalidate>
    <app-password-field [control]="form.controls.currentPassword" label="iam.fields.current-password"
                        autocomplete="current-password"/>
    <app-password-field [control]="form.controls.newPassword" label="iam.fields.new-password"
                        autocomplete="new-password" [showStrength]="true"/>
    <app-password-field [control]="form.controls.confirmPassword" label="iam.fields.confirm-password"
                        autocomplete="new-password" [mismatch]="form.hasError('mismatch')"/>

    <button type="submit" class="submit">{{ 'iam.change.submit' | translate }}</button>
  </form>
</section>
