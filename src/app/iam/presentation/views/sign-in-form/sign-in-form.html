<app-auth-card [title]="'iam.sign-in.title' | translate" [subtitle]="'iam.sign-in.subtitle' | translate">
  @if (notice) {
    <div class="notice" role="status">{{ 'iam.notice.' + notice | translate }}</div>
  }
  @for (error of store.errors(); track error) {
    <div class="error-box" role="alert">{{ error | translate }}</div>
  }

  <app-account-type-toggle [(value)]="accountType"/>

  <form [formGroup]="form" (ngSubmit)="submitSignIn()" novalidate>
    <div class="field">
      <label class="field-label" for="email">{{ 'iam.fields.email' | translate }}</label>
      <input id="email" class="input" type="email" formControlName="email"
             autocomplete="username" placeholder="nombre@correo.com"
             [class.invalid]="errorKey('email')">
      @if (errorKey('email')) {
        <span class="field-error">{{ errorKey('email') | translate }}</span>
      }
    </div>

    <app-password-field [control]="form.controls.password" label="iam.fields.password">
      <button label-action type="button" class="link small" (click)="navigateToForgotPassword()">
        {{ 'iam.sign-in.forgot' | translate }}
      </button>
    </app-password-field>

    <button type="submit" class="submit">
      {{ 'iam.sign-in.submit' | translate }}
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </form>

  <p class="footer-text">
    {{ 'iam.sign-in.no-account' | translate }}
    <button type="button" class="link" (click)="navigateToSignUp()">
      {{ 'iam.sign-in.create-account' | translate }}
    </button>
  </p>
</app-auth-card>
