<div class="field">
  <div class="field-label">
    <label [for]="label()">{{ label() | translate }}</label>
    <ng-content select="[label-action]"/>
  </div>
  <div class="input-wrap">
    <input class="input" [id]="label()" [type]="visible() ? 'text' : 'password'"
           [formControl]="control()" [attr.autocomplete]="autocomplete()"
           [class.invalid]="errorKey()" placeholder="••••••••">
    <button type="button" class="eye" (click)="toggleVisibility()"
            [attr.aria-label]="(visible() ? 'iam.password.hide' : 'iam.password.show') | translate">
      <mat-icon>{{ visible() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </div>

  @if (showStrength() && strength() > 0) {
    <div class="strength" [attr.data-level]="strength()">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <span class="strength-text">{{ 'iam.strength.' + strengthLabel() | translate }}</span>
    </div>
  }

  @if (errorKey()) {
    <span class="field-error">{{ errorKey() | translate }}</span>
  }
</div>
