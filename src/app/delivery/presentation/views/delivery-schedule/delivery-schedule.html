<h1>{{ 'delivery.schedule.title' | translate }}</h1>
<p class="muted">{{ 'delivery.schedule.subtitle' | translate }}</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="card" novalidate>
  <label>
    {{ 'delivery.fields.order' | translate }}
    <input type="number" formControlName="orderId" min="1">
    @if (isInvalid('orderId')) {
      <small class="error">{{ 'delivery.errors.required' | translate }}</small>
    }
  </label>

  <label>
    {{ 'delivery.fields.customer' | translate }}
    <input type="text" formControlName="customerName">
    @if (isInvalid('customerName')) {
      <small class="error">{{ 'delivery.errors.required' | translate }}</small>
    }
  </label>

  <label>
    {{ 'delivery.fields.type' | translate }}
    <select formControlName="type">
      @for (type of types; track type) {
        <option [value]="type">{{ 'delivery.type.' + type | translate }}</option>
      }
    </select>
  </label>

  <label>
    {{ 'delivery.fields.address' | translate }}
    <input type="text" formControlName="address">
    @if (isInvalid('address')) {
      <small class="error">{{ 'delivery.errors.required' | translate }}</small>
    }
  </label>

  <label>
    {{ 'delivery.fields.driver' | translate }}
    <input type="text" formControlName="driverName">
    @if (isInvalid('driverName')) {
      <small class="error">{{ 'delivery.errors.required' | translate }}</small>
    }
  </label>

  <label>
    {{ 'delivery.fields.scheduled-at' | translate }}
    <input type="datetime-local" formControlName="scheduledAt">
    @if (isInvalid('scheduledAt')) {
      <small class="error">{{ 'delivery.errors.required' | translate }}</small>
    }
  </label>

  @for (error of store.errors(); track error) {
    <p class="error" role="alert">{{ error | translate }}</p>
  }

  <button mat-flat-button type="submit">{{ 'delivery.schedule.submit' | translate }}</button>
</form>
